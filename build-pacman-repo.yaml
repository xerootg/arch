---
global-settings:
  repository: /workspace/repo-out/custom.db.tar.gz
  container: pkgbuilds
  read-build-metadata: srcinfo # or "pkgbuild" or "either"
  record-failed-builds: failed-builds.yaml
  install-missing-dependencies: true
  clean-before-build: true
  clean-after-build: true
  force-rebuild: false
  pacman: /workspace/repo/yay-noninteractive # script to work around yay interactive prompts
  arch-filter: [x86_64]
  check: inherit
  packager: xerootg <4009802+xerootg@users.noreply.github.com>
  allow-failure: false
  dereference-database-symlinks: true
members:
  - directory: libfprint-elanmoc2-slg3-git
    pacman: pacman
  - directory: ttf-nanum
  # orca-slicer-git is not a member here on purpose. Its package is 164 MB,
  # which GitHub refuses to accept on push, so it is built by
  # .github/workflows/orca-slicer.yml into release-hosted [orca] instead.
  # Its PKGBUILD lives in release-pkgbuilds/ so this pipeline never walks it.
  - directory: imhex
    allow-failure: true
  - directory: kwin-scripts-xeros-tiling-window-manager
  - directory: ipscan

  # ---------------------------------------------------------------------
  # Added 2026-08-19. Directories are cloned from the AUR at build time by
  # build-inside-container.sh when not already present, so these need not be
  # git submodules. Ordered so dependencies precede their dependents: yay
  # resolves AUR deps itself, but building a dep as a member first avoids
  # building it twice.
  # ---------------------------------------------------------------------

  # allow-failure on every one of these for the initial rollout. The global
  # setting is false, which means one bad PKGBUILD fails the whole run and
  # nothing publishes -- including the five packages that already work. These
  # 22 have never been built here, so containing a failure to the package that
  # caused it matters more than strictness right now. build-pacman-repo records
  # what failed in failed-builds.yaml. Tighten to false per package once each
  # has gone green.
  #
  # This contains ordinary build failures only. An OOM kills the container
  # outright and no allow-failure setting can catch that, which is exactly why
  # the heavy packages below are excluded rather than merely permitted to fail.

  # build2 toolchain, then the xsd stack that needs it
  - directory: build2
    allow-failure: true
  - directory: libcutl
    allow-failure: true
  - directory: libxsd
    allow-failure: true
  - directory: libxsd-frontend
    allow-failure: true
  - directory: xsd
    allow-failure: true
  - directory: libkolabxml
    allow-failure: true

  # All four authentik packages -- cli, agent, browser-support and sysd -- are
  # split packages of a single pkgbase, authentik-platform-git. One entry builds
  # every one of them. Listing them separately makes build-pacman-repo fail with
  # "Duplication detected", because two member directories would carry the same
  # pkgbase.
  # DISABLED: broken in the AUR, not here. build() does
  #   cd "$srcdir/platform/cmd/agent_system"
  # and that path does not exist in the upstream tree any more:
  #   PKGBUILD: line 29: cd: .../src/platform/cmd/agent_system: No such file
  # Nothing this repo can do without carrying a patched PKGBUILD. Re-enable when
  # the AUR package is fixed, or fork it into pkgbuilds/ as a real submodule.
  # - directory: authentik-cli-git
  #   allow-failure: true

  # small C/C++ and Qt bits
  - directory: libpthread-stubs
    allow-failure: true
  - directory: libkcompactdisc
    allow-failure: true
  - directory: accounts-qml-module
    allow-failure: true
  - directory: litehtml0.9
    allow-failure: true

  # python-librespot's real depends include python-pyogg, which is AUR-only, so
  # pacman aborts with "target not found" before the build starts. Build it
  # first. (The dependency walk missed this: it read the AUR metadata, which
  # listed fewer depends than the PKGBUILD actually declares.)
  - directory: python-pyogg
    allow-failure: true

  # python leaves
  - directory: python-async-timeout
    allow-failure: true
  - directory: python-ffmpy
    allow-failure: true
  - directory: python-librespot
    allow-failure: true
  - directory: python-music-tag
    allow-failure: true
  - directory: python-pdm-pep517
    allow-failure: true
  - directory: python-pwinput
    allow-failure: true
  - directory: python-pytest-http-snapshot
    allow-failure: true

  # powershell builds against the official dotnet-sdk-10.0, so it needs no
  # preview SDK. Flagged rather than trusted: the built package may land near
  # the 100 MB push limit, and the size guard in build-inside-container.sh will
  # name it and stop the run rather than let the push fail.
  - directory: powershell
    allow-failure: true

  # Unblocked by release hosting: these are large but cheap to produce
  # (prebuilt binaries, repackaged) and were excluded only by the 100 MB push
  # limit, which no longer applies.
  # DISABLED: build-pacman-repo cannot plan this one.
  #   ⮾ Dependency cycle detected at dotnet-core-preview-bin
  # The pkgbase emits six split packages -- dotnet-host, dotnet-runtime,
  # aspnet-runtime, dotnet-targeting-pack, aspnet-targeting-pack and dotnet-sdk
  # -- which depend on each other. The cycle is resolved fine by makepkg, since
  # one build produces them all at once, but the planner sees it as unorderable
  # and refuses.
  #
  # This is worse than a build failure: it happens before anything is built, so
  # allow-failure cannot contain it and the whole run dies. It needs the same
  # isolated workflow as electron37 and the SYCL stack, publishing into this
  # release.
  # - directory: dotnet-sdk-preview-bin
  #   allow-failure: true
  - directory: llama.cpp-server-tray
    allow-failure: true

  # Still NOT members. Each would break this pipeline rather than merely
  # fail on its own: a package over 100 MB makes the Pages push fail outright
  # and takes every other package's update with it, and an OOM kills the
  # container rather than returning a status `allow-failure` could contain.
  #
  #  electron37
  #    A full Chromium source build (makedepends: gn, clang, gperf). Hours of
  #    compute on a 4-core runner, high OOM risk, and the package is well over
  #    the 100 MB push limit. Needs its own release-hosted repo.
  #
  #  ggml-sycl-f32-git / llama.cpp-sycl-f32-git
  #    Need intel-oneapi-basekit, which is official but unpacks to 9.27 GB.
  #    Buildable in principle -- this pipeline measured ~100 GB free after the
  #    free-disk-space step -- but the build weight is unknown and a stall would
  #    freeze every other package. Own lane, like orca-slicer.
  #
  #  python-pkg_resources
  #    Not in the AUR or the official repos; python-setuptools provides it.
