---
# Packages that cannot share a runner with the others.
#
# build-repo builds ~70 members in one container. That is fine for packages that
# fail cleanly -- allow-failure contains those -- but not for the two failure
# modes that kill the container itself:
#
#   * the OOM reaper, which returns no status for allow-failure to catch
#   * a build that never finishes, which consumes the whole job budget
#
# Either one stops every other package from updating. The fix is isolation: one
# job per package, so a death is contained to the package that caused it. They
# publish into the same custom-repo release, so users still see one repo.
#
# Knobs, all optional:
#   jobs:     cap on make/ninja parallelism. The runner has 4 cores and 16 GB;
#             a translation unit needing 3-4 GB means 2-3 jobs, not 6.
#   timeout:  minutes for this package's job alone.
#   ccache:   keep a compiler cache between runs. Only worth it for real
#             compilation, and it competes for the repo's 10 GB cache budget.
#   lto:      false to build without link-time optimisation. The default is on,
#             matching build-repo, but LTO breaks some projects at link time.
#   preinstall: packages to install from [custom] before makepkg resolves
#             anything. For a package that depends on one of ours which
#             conflicts with a stock one, whichever lands first wins -- so
#             install ours first rather than letting pacman pick.
#   srccache: keep downloaded sources between runs. For anything pulling a
#             multi-gigabyte tarball or git tree.

packages:
  - name: python-frida-git
    jobs: 2
    timeout: 330
    ccache: true
    srccache: true
    note: builds frida-core from source

  - name: ilspy-git
    jobs: 2
    timeout: 180
    srccache: true
    preinstall: [dotnet-sdk-preview-bin]
    note: >-
      Long dotnet build. Its dependencies -- dotnet-sdk-preview-bin and
      powershell -- are both AUR packages this project publishes, so they come
      from [custom] rather than being rebuilt here.

      dotnet-sdk-preview-bin has to go in first. makepkg resolves runtime
      dependencies before buildtime ones, and the runtime pass pulls stock
      dotnet-host out of extra; the buildtime pass then wants
      dotnet-sdk-preview-bin, whose dotnet-host-preview-bin conflicts with the
      dotnet-host already sitting there, and pacman gives up on the whole
      transaction. Installing ours first means the conflict never arises.

  - name: rapidraw-git
    jobs: 3
    timeout: 180
    srccache: true
    note: cargo-tauri plus npm

  - name: dotnet-sdk-preview-bin
    jobs: 4
    timeout: 90
    srccache: true
    note: >-
      build-pacman-repo refuses this one -- its pkgbase emits six split packages
      that depend on each other and the planner calls it a cycle. makepkg builds
      it without complaint, because one build produces all six at once, so it
      only needs to be somewhere the planner is not involved.

  - name: ggml-sycl-f32-git
    jobs: 2
    timeout: 330
    ccache: true
    srccache: true
    lto: false
    note: >-
      Needs intel-oneapi-basekit, which is official but unpacks to 9.27 GB.
      Built without LTO: with it on, linking examples/gpt-2/gpt-2-ctx fails with
      undefined references to gpt_params_parse and friends out of ld-temp.o --
      symbols that live in the static common library and do not survive icpx's
      LTO. Same class of failure that forced !lto on orca-slicer.

  - name: llama.cpp-sycl-f32-git
    jobs: 2
    timeout: 330
    ccache: true
    srccache: true
    lto: false
    note: >-
      Depends on ggml-sycl-f32-git above, which is built by this same matrix.
      A matrix has no way to order its own entries, and serializing the whole
      list to get it would cost more than a day of runner time, so this one
      resolves across runs instead: ggml publishes into [custom], and the next
      run of this workflow installs it from there rather than rebuilding it.
      Expect the first build after ggml is added to fail on a missing
      dependency and the one after it to succeed.

      Built without LTO for the same reason as ggml above: linking
      examples/gguf-hash/llama-gguf-hash fails with seventeen undefined
      references to XXH64, SHA1Init, sha256_init and friends out of ld-temp.o.
      libvendor-hash.a builds fine and "Built target vendor-hash" succeeds --
      icpx's LTO just does not carry those symbols through to the link. Only
      the example breaks; libllama.so itself links clean.

  - name: sentencepiece
    jobs: 3
    timeout: 90
    srccache: true
    note: >-
      Same refusal as dotnet-sdk-preview-bin above: python-sentencepiece depends
      on sentencepiece from the same pkgbase, so build-pacman-repo's planner
      calls it a cycle and aborts the whole seventy-member run. One makepkg
      invocation produces both packages, so the cycle never arises here.
